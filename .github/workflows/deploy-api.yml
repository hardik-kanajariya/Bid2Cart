name: Deploy Admin Panel

on:
  push:
    branches: [main]
    paths:
      - '**'
      - '!UI/**'  # Don't trigger on UI changes
  schedule:
    # Run daily at 2 AM UTC to restore demo data
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      restore_demo_data:
        description: 'Restore demo auction data'
        required: false
        default: false
        type: boolean

jobs:
  deploy-api:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Laravel API via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            git config --global safe.directory /home/b2c-admin/htdocs/b2c-admin.hardikkanajariya.in

            echo "📁 Navigating to Laravel API directory"
            cd /home/b2c-admin/htdocs/b2c-admin.hardikkanajariya.in

            echo "🔄 Pulling latest changes from Git"
            git reset hard
            git clean -fd
            git fetch origin
            git reset --hard origin/main
            git pull origin main
            git status

            echo "🔧 Creating .env file"
            cat > .env << 'EOF'
            APP_NAME=${{ secrets.APP_NAME }}
            APP_ENV=production
            APP_KEY=${{ secrets.APP_KEY }}
            APP_DEBUG=false
            APP_URL=https://b2c-admin.hardikkanajariya.in

            LOG_CHANNEL=stack
            LOG_DEPRECATIONS_CHANNEL=null
            LOG_LEVEL=debug

            DB_CONNECTION=${{ secrets.DB_CONNECTION }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_DATABASE=${{ secrets.DB_DATABASE }}
            DB_USERNAME=${{ secrets.DB_USERNAME }}
            DB_PASSWORD=${{ secrets.DB_PASSWORD }}

            BROADCAST_DRIVER=log
            CACHE_DRIVER=file
            FILESYSTEM_DISK=local
            QUEUE_CONNECTION=sync
            SESSION_DRIVER=file
            SESSION_LIFETIME=120

            MAIL_MAILER=smtp
            MAIL_HOST=${{ secrets.MAIL_HOST }}
            MAIL_PORT=${{ secrets.MAIL_PORT }}
            MAIL_USERNAME=${{ secrets.MAIL_USERNAME }}
            MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}
            MAIL_ENCRYPTION=${{ secrets.MAIL_ENCRYPTION }}
            MAIL_FROM_ADDRESS=${{ secrets.MAIL_FROM_ADDRESS }}
            MAIL_FROM_NAME="${APP_NAME}"

            # Demo Configuration
            DEMO_MODE=true
            DEMO_AUTO_BIDDING=true
            DEMO_BOT_COUNT=50
            DEMO_REGULAR_USER_COUNT=20
            EOF

            echo "🎯 Installing Composer dependencies"
            # Check for composer.json or composer.lock changes
            # if git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E 'composer\.json|composer\.lock\.json'; then
            #   echo "🎯 Installing Composer dependencies"
            #   composer install --no-dev --optimize-autoloader -q
            # else
            #   echo "⏩ Skipping Composer install, no dependency changes detected"
            # fi
            composer install --no-dev --optimize-autoloader -q
            
            echo "🔑 Setting permissions"
            sudo chown -R ubuntu:www-data storage bootstrap/cache
            sudo chmod -R 775 storage bootstrap/cache
            chmod -R 777 storage
            
            echo "⚙️ Running Laravel setup"
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            
            echo "🗃️ Running fresh migration and seeding"
            php artisan migrate:fresh --force
            php artisan db:seed --class=AuctionDemoSeeder --force
            echo "✅ Demo data seeded successfully"
            
            php artisan storage:link 

            echo "🗂️ Optimizing Laravel"
            php artisan optimize

            echo "🧹 Clearing old caches"
            php artisan queue:restart || true

            echo "✅ Laravel API deployment complete!"

  # Separate job for continuous demo data management
  manage-demo-data:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    needs: deploy-api
    steps:
      - name: Manage Demo Auction Activity
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            cd /home/b2c-admin/htdocs/b2c-admin.hardikkanajariya.in
            
            # echo "🎯 Managing auction activity"
            # php artisan auction:maintain-activity
            
            # echo "🤖 Restarting bidding simulation"
            # pkill -f "auction:simulate-bidding" || true
            # nohup php artisan auction:simulate-bidding --duration=1440 > /dev/null 2>&1 &
            
            # echo "📊 Generating activity report"
            # php artisan demo:activity-report

            echo "📁 Navigating to Laravel API directory"
            cd /home/b2c-admin/htdocs/b2c-admin.hardikkanajariya.in

            echo "🔄 Fresh Migration"
            php artisan migrate:fresh --force 
            echo "🔄 Seeding Demo Data"
            php artisan db:seed --class=AuctionDemoSeeder --force
            echo "✅ Demo management complete"