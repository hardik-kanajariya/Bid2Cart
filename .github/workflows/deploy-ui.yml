name: Deploy UI to bid2cart.hardikkanajariya.in

on:
  push:
    branches: [main]
    paths:
      - 'UI/**'  # Only trigger on UI changes

jobs:
  deploy-ui:
    runs-on: ubuntu-latest

    steps:
      - name: Allow Dubious Ownership
        run: git config --global --add safe.directory /home/hardikkanajariya-bid2cart/htdocs/bid2cart

      - name: Deploy Next.js UI via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "📁 Navigating to Next.js UI directory"
            cd /home/hardikkanajariya-bid2cart/htdocs/bid2cart

            echo "🔄 Pulling latest changes from Git"
            git pull origin main

            echo "📂 Moving to UI directory"
            cd UI

            echo "📦 Installing Node.js dependencies"
            npm ci --only=production --force

            echo "🔧 Creating .env file"
            cat > .env.local << 'EOF'
            NEXT_PUBLIC_API_URL=${{ secrets.API_URL }}

            # Social Authetication Details
            NEXT_PUBLIC_GOOGLE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
            NEXT_PUBLIC_FACEBOOK_APP_ID=${{ secrets.NEXT_PUBLIC_FACEBOOK_APP_ID }}
            NEXT_PUBLIC_FACEBOOK_APP_SECRET=${{ secrets.NEXT_PUBLIC_FACEBOOK_APP_SECRET }}

            # Social Links
            NEXT_PUBLIC_SOCIAL_FACEBOOK=https://www.facebook.com
            NEXT_PUBLIC_SOCIAL_TWITTER=https://www.twitter.com
            NEXT_PUBLIC_SOCIAL_INSTAGRAM=https://www.instagram.com
            NEXT_PUBLIC_SOCIAL_PINTREST=https://www.pintrest.com

            # Emails
            NEXT_PUBLIC_CONTACT_EMAIL=support@bid2cart.com
            NEXT_PUBLIC_CONTACT_EMAIL2=info@bid2cart.com

            # Mobile
            NEXT_PUBLIC_CONTACT_PHONE=+613 458 9585
            NEXT_PUBLIC_CONTACT_PHONE2=+965 566 8596

            # Address
            NEXT_PUBLIC_CONTACT_ADDRESS_LINE1=45 Brisbane Road
            NEXT_PUBLIC_CONTACT_ADDRESS_LINE2=Unit 19#
            NEXT_PUBLIC_CONTACT_ADDRESS_AREA_CODE=M3J2K1
            NEXT_PUBLIC_CONTACT_ADDRESS_COUNTRY=Toronto
            EOF

            # Remove old static files
            rm -rf /home/hardikkanajariya-bid2cart/htdocs/bid2cart/UI/out

            echo "🏗️ Building Next.js static application"
            npm run build

            echo "📦 Exporting Next.js static files"
            npm run export 

            echo "✅ Next.js static deployment complete!"